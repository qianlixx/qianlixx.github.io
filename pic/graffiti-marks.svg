<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="transparent"/>
  <!-- Cross mark 1 -->
  <g transform="translate(40,40) rotate(15)">
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#DC2626" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#DC2626" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.2" transform="translate(2,0)"/>
  </g>
  <!-- Cross mark 2 (thinner, tilted differently) -->
  <g transform="translate(120,130) rotate(-10)">
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#DC2626" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <line x1="15" y1="-15" x2="-15" y2="15" stroke="#DC2626" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  </g>
  <!-- Hashtag / Grid mark -->
  <g transform="translate(130,45) rotate(8)">
    <line x1="-15" y1="-25" x2="-15" y2="25" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="15" y1="-25" x2="15" y2="25" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="-25" y1="10" x2="25" y2="10" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>
  <!-- Arrow tag -->
  <g transform="translate(50,130)">
    <path d="M-20,0 L20,0 M15,-5 L20,0 L15,5" stroke="#DC2626" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>
  <!-- Star burst -->
  <g transform="translate(60,90)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#F59E0B" stroke-width="2" opacity="0.15"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#F59E0B" stroke-width="2" opacity="0.15"/>
  </g>
</svg>
